name: Snapshot, retrain and promote

on:
  schedule:
    # GitHub Actions usa UTC; se ejecuta diariamente después de la recolección.
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [snapshot-retrain]

permissions:
  contents: read

concurrency:
  group: pulso-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-student.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-student.txt

      - name: Collect latest observations
        run: python -m src.collector

      - name: Snapshot, retrain and promote if significant
        run: python -m src.retrain --origins 96
