name: Snapshot, retrain and promote

on:
  schedule:
    # GitHub Actions usa UTC; revisa cada hora si la accuracy cayó >= 3 puntos.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [snapshot-retrain]

permissions:
  contents: read

concurrency:
  group: pulso-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-student.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-student.txt

      - name: Collect latest observations
        run: |
          for attempt in 1 2 3; do
            python -m src.collector --batch-size 250 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Collector temporalmente indisponible; reintentando en 20 s"
              sleep 20
            fi
          done
          exit 1

      - name: Snapshot, retrain and promote if significant
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.retrain --origins 96 --only-if-regressed --drop-points 3
          else
            python -m src.retrain --origins 96
          fi
