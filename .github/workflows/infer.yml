name: Inference

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [cron-job-inference]

permissions:
  contents: read

concurrency:
  # Comparte el lock con collector.yml porque este workflow también ingesta
  # antes de inferir; así nunca compiten por el cursor confirmado.
  group: pulso-ingestion
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-student.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-student.txt

      - name: Collect incremental observations
        run: |
          for attempt in 1 2 3; do
            python -m src.collector --batch-size 250 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Collector temporalmente indisponible; reintentando en 20 s"
              sleep 20
            fi
          done
          exit 1

      - name: Generate and submit predictions
        run: python -m src.infer --bucket model-artifacts

      - name: Evaluate revealed targets and leaderboard
        run: python -m src.evaluate

      - name: Monitor drift and pipeline
        run: python -m src.monitor
