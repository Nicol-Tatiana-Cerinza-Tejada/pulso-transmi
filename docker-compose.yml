name: pulso-transmi

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 640m
    cpus: 0.40
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
    image: pulso-transmi-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://academy_api:${API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    mem_limit: 384m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scheduler:
    image: pulso-transmi-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://academy_scheduler:${SCHEDULER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCHEDULER_INSTANCE: primary
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.20
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
